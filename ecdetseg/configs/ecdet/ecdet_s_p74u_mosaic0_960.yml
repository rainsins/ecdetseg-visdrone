  - 'struct_s.yml'                 # S structural delta
  - 'protocol/res960.yml'          # resolution 960
  - 'protocol/p74u_mosaic0.yml'    # protocol, LAST -> authoritative (Mosaic off)
output_dir: outputs/p74u_mosaic0_960
