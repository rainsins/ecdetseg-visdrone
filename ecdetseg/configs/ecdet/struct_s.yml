# ============================================================
# ECDet-S structural delta ONLY (no protocol, no output_dir,
# no optimizer — those live in protocol/p30u.yml).
# Mirrors the S-size fields of the frozen configs/ecdet/ecdet_s.yml
# without depending on its hardcoded output_dir / duplicated optimizer.
# ============================================================
ViTAdapter:
  name: ecvitt
  embed_dim: 192
  num_heads: 3
  interaction_indexes: [10, 11]
  weights_path: ecvits/ecvitt.pth      # overridable via `-u ViTAdapter.weights_path=...`

HybridEncoder:
  in_channels: [192, 192, 192]
  depth_mult: 0.67
  expansion: 0.34
  hidden_dim: 192
  dim_feedforward: 512

ECTransformer:
  feat_channels: [192, 192, 192]
  hidden_dim: 192
  dim_feedforward: 512
  num_layers: 4
  eval_idx: -1
