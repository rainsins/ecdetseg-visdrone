# ============================================================
# P74u training protocol — VisDrone baseline (EdgeCrafter official S 74-epoch).
# Based on p30u.yml; only the schedule/aug keys below differ (all other keys
# verbatim). Included LAST.
#
#   schedule : epochs=74  stop_epoch=72  flat_epoch=36  lr_gamma=0.5  (no-aug=2)
#   aug      : Mosaic prob=0.75 epoch=36 | Mixup prob=0.75 epoch=36   (ON)
#   ema      : decay=0.9999 (official)
#
# NOTE vs p30u.yml: p30u REMOVED the Mosaic op (its default aug tier is
# "Mosaic off"). P74u is the official protocol with Mosaic ON, so the Mosaic op
# is restored here. Without it, mosaic_prob:0.75 only gates RandomZoomOut /
# RandomIoUCrop (container.py:83-96) and no Mosaic is ever applied.
# The Mosaic-off ablation lives in protocol/p74u_mosaic0.yml (same ops,
# mosaic_prob:0 -> Mosaic skipped, ZoomOut/IoUCrop always on).
# ============================================================
epochs: 74
no_aug_epoch: 2          # NOTE: informational only (audit.md Q4)
flat_epoch: 36
warmup_iter: 2000
lr_gamma: 0.5

sync_bn: False
find_unused_parameters: False
use_amp: True
scaler:
  type: GradScaler
eval_maxDets: 300

use_ema: True
ema:
  type: ModelEMA
  decay: 0.9999
  warmups: 1000
  start: 0

optimizer:
  type: AdamW
  lr: 0.0005
  betas: [0.9, 0.999]
  weight_decay: 0.0001
  params:
    -                                   # backbone, except norm/bn/bias
      params: '^(?=.*.backbone)(?!.*(?:norm|bn|bias)).*$'
      lr: 0.000025
    -                                   # backbone norm/bn/bias
      params: '^(?=.*.backbone)(?=.*(?:norm|bn|bias)).*$'
      lr: 0.000025
      weight_decay: 0.
    -                                   # non-backbone norm/bn/bias
      params: '^(?!.*\.backbone)(?=.*(?:norm|bn|bias)).*$'
      weight_decay: 0.

train_dataloader:
  shuffle: True
  total_batch_size: 8
  num_workers: 4                        # single source of truth for workers
  dataset:
    transforms:
      policy: stop_epoch
      stop_epoch: 72
      mosaic_prob: 0.75
      mosaic_epoch: 36
      remove_ops: ['Mosaic', 'RandomPhotometricDistort', 'RandomZoomOut', 'RandomIoUCrop']
      ops:
        - {type: Mosaic, output_size: 320, rotation_range: 10, translation_range: [0.1, 0.1], scaling_range: [0.5, 1.5], fill_value: 0, max_cached_images: 50, random_pop: True}
        - {type: RandomPhotometricDistort, p: 0.5}
        - {type: RandomZoomOut, fill: 0}
        - {type: RandomIoUCrop, p: 0.8}
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: RandomHorizontalFlip}
        - {type: Resize, size: [640, 640]}
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: ConvertPILImage, dtype: 'float32', scale: True}
        - {type: Normalize, mean: [0.485, 0.456, 0.406], std: [0.229, 0.224, 0.225]}
        - {type: ConvertBoxes, fmt: 'cxcywh', normalize: True}
  collate_fn:
    type: BatchImageCollateFunction
    mixup_prob: 0.75
    mixup_epoch: 36

val_dataloader:
  total_batch_size: 16
  num_workers: 4
