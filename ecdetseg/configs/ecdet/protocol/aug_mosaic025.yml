# ============================================================
# Mosaic ablation override (mosaic_prob = 0.25).
# Include LAST (after protocol/p30u.yml) to re-enable Mosaic on top of the
# Mosaic-off default. Select it via the variant entry
#   configs/ecdet/ecdet_s_p30u_mosaic025.yml
# so that E1/E2/E3 + this file give "P30u + Mosaic@0.25".
#
# The ops list is repeated in full because merge_dict replaces lists wholesale
# (no element-wise insertion); Mosaic must be the first op.
# ============================================================
train_dataloader:
  dataset:
    transforms:
      mosaic_prob: 0.25
      mosaic_epoch: 26
      remove_ops: ['Mosaic', 'RandomPhotometricDistort', 'RandomZoomOut', 'RandomIoUCrop']
      ops:
        - {type: Mosaic, output_size: 320, rotation_range: 10, translation_range: [0.1, 0.1], scaling_range: [0.5, 1.5], fill_value: 0, max_cached_images: 50, random_pop: True}
        - {type: RandomPhotometricDistort, p: 0.5}
        - {type: RandomZoomOut, fill: 0}
        - {type: RandomIoUCrop, p: 0.8}
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: RandomHorizontalFlip}
        - {type: Resize, size: [640, 640]}
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: ConvertPILImage, dtype: 'float32', scale: True}
        - {type: Normalize, mean: [0.485, 0.456, 0.406], std: [0.229, 0.224, 0.225]}
        - {type: ConvertBoxes, fmt: 'cxcywh', normalize: True}
