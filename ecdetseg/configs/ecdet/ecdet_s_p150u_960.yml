# ============================================================
# ECDet-S @ P150u @ 960 — VisDrone long-schedule baseline, 960 input (Mosaic ON)
#   schedule : epochs=150  stop_epoch=148  flat_epoch=72  lr_gamma=0.5  (no-aug=2)
#   aug tier : Mosaic ON (prob=0.75 epoch=72) | Mixup ON (prob=0.75 epoch=72)
#   early_stop: enabled (start=100, patience=20, min_delta=0.001)
#   resolution: 960 -> reset_cfg derives Mosaic.output_size=480, Resize=960
#
# include order = increasing priority. DO NOT REORDER (later wins):
#   data < base(ecdet.yml) < S struct < resolution(res960) < protocol/p150u.yml (LAST)
#
# NOTE: 960 has ~2.25x the activation memory of 640. On a 16G Arc, bs10 will likely
#       OOM -> pass an extra override, e.g. `total_batch_size=4` (or 6).
#       Always use a DIFFERENT output root for 960 (e.g. outputs/p150u_960).
# ============================================================
__include__:
  - '../dataset/visdrone.yml'      # data only (paths injected by run_exp.sh)
  - 'ecdet.yml'                    # base detector structure + default aug ops
  - 'struct_s.yml'                 # S structural delta
  - 'protocol/res960.yml'          # resolution 960
  - 'protocol/p150u.yml'           # protocol, LAST -> authoritative
seed: 42
output_dir: outputs/p150u_960
