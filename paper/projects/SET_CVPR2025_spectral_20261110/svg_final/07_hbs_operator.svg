<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" font-family="Microsoft YaHei, Arial" data-pptx-page-role="content">
<rect id="background" data-pptx-role="background" width="1280" height="720" fill="#FFFFFF" />
<g id="header" data-pptx-bounds="56 30 1168 112"><text x="56" y="52" font-size="16" fill="#087E8B">02 / HBS · 平滑算子</text><text x="56" y="111" font-size="40" font-weight="bold" fill="#142D4E">压缩—扩张瓶颈，让背景变得平滑</text></g>
<g id="operator-formula" data-pptx-replace-with="formula" data-pptx-x="74" data-pptx-y="168" data-pptx-width="1130" data-pptx-height="108" data-pptx-bounds="74 168 1130 108"><metadata type="application/json">{"latex":"\\phi_i(P_i^{bg},r)=\\sigma(w_i^e\\otimes\\sigma(w_i^r\\otimes P_i^{bg}))+P_i^{bg}","display":"block","font_size":30,"color":"#142D4E","align":"center"}</metadata><text x="640" y="229" text-anchor="middle" font-size="30" fill="#142D4E">φᵢ(Pᵢᵇᵍ, r) = σ(wᵢᵉ ⊗ σ(wᵢʳ ⊗ Pᵢᵇᵍ)) + Pᵢᵇᵍ</text></g>
<g id="bottleneck-explanation" data-pptx-bounds="56 304 1168 133"><rect x="56" y="304" width="1168" height="133" fill="#F1F5F9" /><text x="80" y="347" font-size="28" font-weight="bold" fill="#087E8B">通道压缩 → ReLU → 通道扩张 → ReLU → 加回背景残差</text><text x="80" y="401" font-size="24" fill="#243447">r=4控制压缩程度；扩张难以重建高频细节，残差保留必要的背景上下文。</text></g>
<g id="kernel-formula" data-pptx-replace-with="formula" data-pptx-x="56" data-pptx-y="473" data-pptx-width="520" data-pptx-height="130" data-pptx-bounds="56 473 520 130"><metadata type="application/json">{"latex":"K_i=2\\left\\lfloor\\frac{\\log_2(S_i)}{2}\\right\\rfloor+1","display":"block","font_size":30,"color":"#142D4E","align":"left"}</metadata><text x="76" y="545" font-size="30" fill="#142D4E">Kᵢ = 2⌊log₂(Sᵢ) / 2⌋ + 1</text></g>
<g id="kernel-explanation" data-pptx-bounds="625 475 599 160"><text font-size="24" fill="#243447" x="625" y="511">核随FPN步长Sᵢ调整：低层小核，高层大核。</text><text font-size="24" fill="#243447" x="625" y="549">取奇数核以保持中心对齐。</text><text x="625" y="604" font-size="20" fill="#BC5A24">这是学习式平滑，不是严格的理想低通滤波器。</text></g>
<g id="footer" data-pptx-bounds="56 653 1168 34" font-size="16" fill="#58677A"><text x="56" y="675">来源：SET，PDF p.4，式(3)–(4)；σ为ReLU，⊗为卷积</text><text x="1189" y="675">07</text></g>
</svg>