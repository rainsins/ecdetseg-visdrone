<g id="header" data-pptx-bounds="56 30 1168 112"><text x="56" y="52" font-size="16" fill="#BC5A24">04 / 研究设想 · 尚未验证</text><text x="56" y="111" font-size="40" font-weight="bold" fill="#142D4E">对EdgeCrafter：先验证诊断，再迁移模块</text></g>
<g id="experiment-sequence" data-pptx-bounds="56 170 734 375"><line x1="78" y1="203" x2="78" y2="494" stroke="#D5DFE8" stroke-width="3" /><circle cx="78" cy="201" r="18" fill="#087E8B" /><circle cx="78" cy="298" r="18" fill="#087E8B" /><circle cx="78" cy="395" r="18" fill="#087E8B" /><circle cx="78" cy="492" r="18" fill="#087E8B" /><text x="78" y="208" text-anchor="middle" font-size="20" fill="#FFFFFF">1</text><text x="78" y="305" text-anchor="middle" font-size="20" fill="#FFFFFF">2</text><text x="78" y="402" text-anchor="middle" font-size="20" fill="#FFFFFF">3</text><text x="78" y="499" text-anchor="middle" font-size="20" fill="#FFFFFF">4</text><text x="120" y="207" font-size="24" font-weight="bold" fill="#142D4E">固定VisDrone基线</text><text x="120" y="240" font-size="20" fill="#58677A">统一数据切分、输入尺度和训练预算。</text><text x="120" y="304" font-size="24" font-weight="bold" fill="#142D4E">先复现频域遮挡诊断</text><text x="120" y="337" font-size="20" fill="#58677A">检验背景高频是否也是当前模型的主要干扰。</text><text x="120" y="401" font-size="24" font-weight="bold" fill="#142D4E">再做模块与对照实验</text><text x="120" y="434" font-size="20" fill="#58677A">HBS、API、联合；加入全图平滑对照。</text><text x="120" y="498" font-size="24" font-weight="bold" fill="#142D4E">同时测精度、误差和成本</text><text x="120" y="531" font-size="20" fill="#58677A">分尺度AP、多随机种子、训练时间、峰值显存。</text></g>
<g id="hypothesis-boundary" data-pptx-bounds="840 173 384 361"><rect x="840" y="173" width="384" height="361" fill="#F1F5F9" /><text x="864" y="218" font-size="28" font-weight="bold" fill="#BC5A24">优先验证的问题</text><text font-size="24" fill="#243447" x="864" y="276">拥挤场景中，框掩码会</text><text font-size="24" fill="#243447" x="864" y="314">保留多少无关背景？</text><text font-size="24" fill="#243447" x="864" y="373">对当前特征的平滑，</text><text font-size="24" fill="#243447" x="864" y="411">会不会误清有用纹理？</text><text x="864" y="483" font-size="20" fill="#58677A">这些是研究假设，并非论文结论。</text></g>
<g id="research-priority" data-pptx-bounds="56 565 1168 76"><rect x="56" y="565" width="1168" height="76" fill="#142D4E" /><text x="78" y="598" font-size="24" font-weight="bold" fill="#FFFFFF">当前优先精度改进论文；必要时租用更强GPU完成实验。</text><text x="78" y="627" font-size="20" fill="#FFFFFF">量化、轻量化和部署效率留作后续独立研究。</text></g>
