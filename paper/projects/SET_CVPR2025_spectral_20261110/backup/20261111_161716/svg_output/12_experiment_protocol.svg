<g id="header" data-pptx-bounds="56 30 1168 112"><text x="56" y="52" font-size="16" fill="#087E8B">03 / 实验与判断</text><text x="56" y="111" font-size="40" font-weight="bold" fill="#142D4E">先看实验条件，再判断增益有多稳</text></g>
<g id="datasets" data-pptx-bounds="56 164 1168 94"><rect x="56" y="164" width="1168" height="94" fill="#F1F5F9"/><text x="80" y="203" font-size="28" font-weight="bold" fill="#142D4E">AI-TOD　/　VisDrone2019　/　DOTA-v2.0　/　COCO 2017</text><text x="80" y="239" font-size="20" fill="#58677A">从微小目标、无人机场景，扩展到通用目标检测。</text></g>
<g id="cnn-settings" data-pptx-bounds="56 292 548 248"><text x="56" y="327" font-size="30" font-weight="bold" fill="#087E8B">CNN检测器</text><text x="56" y="381" font-size="24" fill="#243447"><tspan x="56" dy="0">ResNet-50 · ImageNet预训练</tspan><tspan x="56" dy="38">SGD · 12 epochs · batch size 2</tspan><tspan x="56" dy="38">初始学习率0.005</tspan><tspan x="56" dy="38">AI-TOD输入固定为800×800</tspan></text></g>
<g id="dino-settings" data-pptx-bounds="666 292 558 248"><text x="666" y="327" font-size="30" font-weight="bold" fill="#BC5A24">Transformer检测器</text><text x="666" y="381" font-size="24" fill="#243447"><tspan x="666" dy="0">DINO · 5-scale特征</tspan><tspan x="666" dy="38">36 epochs · Adam优化器</tspan><tspan x="666" dy="38">遵循DETR随机裁剪与尺度增强</tspan><tspan x="666" dy="38">不能把CNN与DINO当成同一预算</tspan></text></g>
<g id="implementation-notes" data-pptx-bounds="56 560 1168 75"><line x1="56" y1="562" x2="1224" y2="562" stroke="#D5DFE8"/><text x="56" y="596" font-size="24" fill="#243447">平台：RTX 3090 · PyTorch / MMDetection</text><text x="56" y="629" font-size="20" fill="#58677A">表中“*”表示改用P2–P6 FPN特征；收益解释必须绑定对应基线和训练设置。</text></g>
