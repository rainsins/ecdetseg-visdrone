<g id="first-order-label" data-pptx-bounds="56 165 640 51"><text x="56" y="198" font-size="28" font-weight="bold" fill="#BC5A24">① 单分支：梯度方向 + L2归一化</text></g>
<g id="api-direction" data-pptx-replace-with="formula" data-pptx-x="56" data-pptx-y="238" data-pptx-width="660" data-pptx-height="142" data-pptx-bounds="56 238 660 142"><metadata type="application/json"><![CDATA[{"latex":"\\epsilon_{i,cls}^{*}\\approx\\rho\\frac{\\nabla_{P_i}L_{cls}(P_i)}{\\|\\nabla_{P_i}L_{cls}(P_i)\\|_2}","display":"block","font_size":30,"color":"#142D4E","align":"left"}]]></metadata><text x="76" y="315" font-size="30" fill="#142D4E">ε*ᵢ,cls ≈ ρ</text><text x="390" y="283" text-anchor="middle" font-size="28" fill="#142D4E">∇Pᵢ Lcls(Pᵢ)</text><line x1="245" y1="300" x2="550" y2="300" stroke="#142D4E" stroke-width="1.5"/><text x="390" y="345" text-anchor="middle" font-size="28" fill="#142D4E">‖∇Pᵢ Lcls(Pᵢ)‖₂</text></g>
