<g id="api-interpretation" data-pptx-bounds="772 175 452 444"><rect x="772" y="175" width="452" height="444" fill="#F1F5F9"/><text x="796" y="220" font-size="30" font-weight="bold" fill="#142D4E">如何理解？</text><text x="796" y="275" font-size="24" fill="#243447"><tspan x="796" dy="0">在L2约束内，用一阶近似</tspan><tspan x="796" dy="38">寻找让检测损失增加的方向。</tspan><tspan x="796" dy="58">FCOS融合分类、回归和</tspan><tspan x="796" dy="38">center-ness分支的扰动。</tspan><tspan x="796" dy="58">论文默认扰动强度ρ=1。</tspan></text><text x="796" y="555" font-size="20" fill="#BC5A24"><tspan x="796" dy="0">不是随机噪声，也不是像素攻击；</tspan><tspan x="796" dy="31">作用位置是中间特征。</tspan></text></g>
